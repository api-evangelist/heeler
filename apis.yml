aid: heeler
name: Heeler
description: 'Heeler is the Agentic Development Security Platform — machine-speed security for AI-written
  code. As coding agents (Claude Code, Cursor, GitHub Copilot) and AI attackers reshape the software
  development lifecycle, Heeler prevents vulnerabilities during code generation, autonomously fixes
  dependency and code issues with CI-validated merge-ready pull requests, and continuously audits open
  source (SCA), code security (SAST), secrets, and agent-skill threats across the AI SDLC. It embeds
  security policy into coding agents through MCP servers and agent skills, deploys without build
  modification ("live in a day"), and is SOC 2 Type II certified. Heeler is backed by Norwest Venture
  Partners.'
